name: Serper Lifecycle
description: >-
  Serper publishes an operational status page and a refund policy, but no API versioning
  policy, no deprecation policy, no Sunset/Deprecation header contract, no changelog and
  no SLA outside the Ultimate tier's marketing copy. Consumers get no advance notice
  mechanism for a breaking change.

versioning:
  scheme: none
  documented: false
  url_versioning: false
  header_versioning: false
  detail: >-
    No Serper endpoint carries a version segment, and no version header or response field
    is published. A change to a response shape would reach every consumer at once.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  detail: >-
    No deprecation policy is published and no operation in any definition in this repo is
    marked deprecated. Note that Serper's own playground gates several types behind an
    @serper.dev email address (product-reviews, maps-autocomplete, bing-search,
    bing-images, search-full, serper-search) — those are pre-release, not deprecated, and
    are deliberately excluded from this profile.

changelog:
  published: false
  url: null
  detail: >-
    Serper maintains no dated changelog. The closest first-party surface is a Medium
    reading list linked from the footer
    (https://medium.com/@serper/list/articles-3f700b49cbc4), which returned HTTP 403
    behind Cloudflare when probed on 2026-08-13 and is a marketing feed rather than a
    change record.

