name: Serper MCP
description: >-
  Serper ships NO MCP server of its own — no hosted endpoint, no published package, no
  mention of MCP anywhere on serper.dev. The tool list below is a CANDIDATE derived from
  the OpenAPI definitions in this repo, not something Serper publishes. Every MCP server
  that exposes Serper today is a third-party wrapper around Serper's REST API, installed
  and run by the end user with their own API key.

deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: searched
  note: >-
    mode is `none` because Serper publishes neither a remote MCP endpoint nor a
    first-party stdio package. `auth: api-key` records how any Serper-backed MCP server
    must authenticate (X-API-KEY header, user-supplied key), not that Serper operates
    one. Serper's own footer links a Jan AI MCP example page
    (https://jan.ai/docs/mcp-examples/search/serper) which returned HTTP 404 when probed
    2026-08-13 — Serper points at MCP but does not operate the server behind the link.

status: candidate

surfaces:
  rest:
    base_urls:
      - https://google.serper.dev
